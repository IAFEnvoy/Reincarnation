<!DOCTYPE html>
<html>
<head>
    <meta name="aui-viewport" content="mode=gui">
    <link rel="stylesheet" href="/apricityui/theme/ore/ore.css">
    <link rel="stylesheet" href="information.css">
</head>
<body class="ore-theme life-information">
<div id="panel" class="panel">
    <div id="title" class="text title"></div>
    <div id="subtitle" class="text text-muted"></div>
    <button id="expand" class="button button-primary-2"><translation>screen.reincarnation.information.expand</translation></button>
    <button id="collapse" class="button button-secondary-2"><translation>screen.reincarnation.information.collapse</translation></button>
    <button id="close" class="button button-danger-2">X</button>
    <div id="history_caption" class="text caption"><translation>screen.reincarnation.information.history</translation></div>
    <div id="selected" class="text caption"></div>
    <div id="history" class="list list-group-2"></div>
    <div id="details" class="list list-group-2"></div>
    <button id="previous" class="button button-secondary-2">&lt;</button>
    <div id="page_number" class="text page-number"></div>
    <button id="next" class="button button-secondary-2">&gt;</button>
</div>
</body>
</html>
